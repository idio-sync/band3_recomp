; Most of these settings can also be changed in game: press F4 and open the Band3
; categories. "Save to config" there writes band3.toml next to the exe, and
; anything in band3.toml (or passed as --name=value on the command line)
; overrides this file.

[controller]
; Instrument that gamepads and the keyboard play as
; -1 = don't override, 1 = vocals, 7 = guitar, 8 = drums
; (see: https://learn.microsoft.com/en-us/windows/win32/xinput/xinput-and-controller-subtypes)
; Only controllers that don't report an instrument type are changed, so with
; input_backend = xinput below, real Xbox 360 instruments keep their own type
; (drums stay drums) while gamepads play as this one.
type = 7
; Controller backend: sdl or xinput (xinput is Windows-only). Leave empty for the default (sdl).
; Read at startup, so changing it needs a restart.
input_backend =

[rnd]
; Vertical sync mode: -1 = don't override, 0 = disable, 1 = enable
sync = 1
; Refresh rate the game runs at, in Hz (0 = don't override; the console runs at 60)
; With sync = 1 the game draws one frame per refresh, e.g. 120 for a 120Hz monitor.
; Anything the game times in frames instead of seconds may run faster above 60.
refresh_rate = 0

[venue]
; small_club_##:    01, 02, 03, 04, 05, 06, 10, 11, 13, 14, 15
; big_club_##:      01, 02, 04, 15, 17
; arena_##:         01, 04, 06, 07, 10, 11, 12
; festival_##:      01, 02
; video_##:         01, 02, 03, 04, 05, 06, 07
; black_background: none
; no_forced_venue:  false
; comma separated multi venues and classes of venues are also supported. EX:
; forced_venue = none, video, festival_02
; will randomly will pick between no venue, all 7 video venues, and festival_02
forced_venue = false

[window]
; Start in fullscreen mode: true or false
fullscreen = false
; Window size in pixels (does not change the game's rendering resolution)
width = 1280
height = 720

[game]
; Directory containing the original game assets (default.xex and gen directory)
game_data_root = "assets"
; skip the splash screens when the game has finished initing
fast_start = false
;disable background menu music: true or false
disable_metamusic = false
; Force the game to run in a specific language
; You can also do this by passing "-lang X" as a launch argument
; eng = English
; esl = Spanish
; fre = French
; ita = Italian
; deu = German
lang = eng
; Tell the game's scripts RB3Enhanced is running, so Rock Band 3 Deluxe turns on
; its RB3E features (its version line, party mode, song lookups, and clearing the
; song cache and restarting after an update). Needs a restart.
rb3e_mode = false
; Play songs faster or slower (1.5 is half again as fast), from the next song.
; A speed other than 1 that practice mode or Deluxe sets is left as it is.
song_speed = 1.0
; Scroll the note highway faster or slower (2 is twice as fast), from the next song
track_speed = 1.0

[graphics]
; Disable approximate lighting
; works around a graphical bug in current versions of rexglue
; will be removed in the future when this is not necessary anymore
disable_approximate_lights = true
; disables the use of the hair shader variation on materials
disable_hair_shader = false
; force all materials to not use an environ, basically becoming fullbright for most things
fullbright = false
; enables or disables compression of textures of characters
; if enabled, readback resolve will be required otherwise the textures will appear bugged!
compress_character_textures = false
; disable even/odd rendering, processing all commands every frame
disable_even_odd_rendering = false

[profile]
; Override your displayed username
username = User

[events]
; Send RB3Enhanced-compatible events over UDP: Stage Kit lighting, song, band,
; venue and screen info, and RB3 Deluxe's rb3e_send_event_string data
enabled = false
; 255.255.255.255 broadcasts to the local network. If receivers see nothing
; (common with VPN or virtual adapters), use your subnet's broadcast address
; (e.g. 192.168.1.255) or one device's IP. target and port need a restart.
target = 255.255.255.255
port = 21070

[discord]
; Show the current song as Discord Rich Presence (needs the Discord desktop app).
; Read at startup, so changing it needs a restart.
enabled = false

[http]
; Serve RB3Enhanced's web page and API on this PC and the local network: open
; http://<this PC's address>:21070/ on a phone to browse the songs and select one
; in the Music Library. enabled and port need a restart.
enabled = false
port = 21070
; 0.0.0.0 listens on the local network, 127.0.0.1 on this PC only
address = 0.0.0.0
; Let web pages from other sites use the API (Access-Control-Allow-Origin: *)
allow_cors = false
; Let /execute?script= run DTA scripts. Anyone on the local network could then
; run any script in the game, so leave this off unless you need it.
allow_scripts = false

[audio]
; Maximum number of queued audio frames (default: 3, rexglue default: 64)
max_queued_frames = 3

[memory]
; Override heap sizes (0 = use default from mem.dta)
; Default main heap: 105000000, default char heap: 32000000
; these cannot add up to exceed 0x40000000 or the game will crash on start
main_heap_size = 0
char_heap_size = 0

[debug]
; Show the debug overlay (FPS counter): true or false
overlay = true
; Log level: trace, debug, info, warn, error, critical
log_level = info
; Use native C++ replacements for the game's math functions (sin, cos, pow, vector/matrix ops)
native_math = true
; Use the frame-rate independent camera shake replacement
native_camera_shake = true

; Log the game's frame time against the wall clock once a second while the
; camera shake runs (checks that the shake's time source is real at refresh_rate > 60)
log_shake_timing = false
